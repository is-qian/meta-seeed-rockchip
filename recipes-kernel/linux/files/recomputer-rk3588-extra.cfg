# reComputer RK3588 DevKit specific kernel options.
# Both ethernet ports are PCIe RTL8125 NICs (pcie2x1l0/l2 in the board DTS,
# there is no SoC GMAC wiring on this board).  r8169 is the in-tree driver for
# them; without it no eth interface ever appears.  Armbian ships the same
# driver as =m.
CONFIG_R8169=y
# Mali-G610 GPU (vendor valhall kbase driver, matches the "arm,mali-valhall"
# DT node the board DTS already enables).  Mirrors the SDK's own rk3588.config
# fragment: the "rk" platform name selects the Rockchip power/clock glue.
# Userspace stays in containers (libmali), the OS only provides /dev/mali0.
CONFIG_MALI_VALHALL=y
CONFIG_MALI_VALHALL_PLATFORM_NAME="rk"
