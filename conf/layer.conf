BBPATH .= ":${LAYERDIR}"

# Export the absolute layer path for optional integration layers.  This keeps
# consumers independent of the checkout layout used by a superproject.
SEEED_ROCKCHIP_LAYERDIR := "${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "seeed-rockchip"
BBFILE_PATTERN_seeed-rockchip := "^${LAYERDIR}/"
BBFILE_PRIORITY_seeed-rockchip = "7"

LAYERDEPENDS_seeed-rockchip = "core openembedded-layer rockchip"

LAYERSERIES_COMPAT_seeed-rockchip = "wrynose"
