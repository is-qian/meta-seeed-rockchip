#@TYPE: Machine
#@NAME: Seeed reComputer RK3576 DevKit
#@DESCRIPTION: Seeed RK3576 development kit with eMMC, SD, SPI-NOR and M.2 NVMe.

# Use the Rockchip layer shipped inside the staged official SDK.  The SDK
# layer supplies the common RK3576 tune and Rockchip defaults; this machine
# keeps its own kernel/U-Boot recipes, mirroring the RK3588 setup.
require conf/machine/include/rk3576.inc
require conf/machine/include/recomputer-common.inc

PREFERRED_PROVIDER_virtual/kernel = "linux-seeed"

KERNEL_DEVICETREE = "rockchip/rk3576-recomputer-rk3576-devkit.dtb"
UBOOT_MACHINE = "recomputer-rk3576-devkit_defconfig"

# The two ethernet ports are SoC GMACs with RTL8211F PHYs (no NIC firmware
# needed, unlike the RK3588 devkit's PCIe RTL8125 pair).
# NOTE: the rkaiq/rkisp camera 3A stack for RK3576 comes from Seeed's
# prebuilt deb (camera-engine-rkaiq-rk3576 recipe) instead of the source
# build used on RK3588: the rk3576-side closed 3A blobs do not link with
# the Wrynose toolchain yet (RK3588 phase-5 leftover #11), and the deb
# ships fully prelinked binaries built with the vendor-required Arm GCC
# 8.3.  The rkisp tuner server stays out until a camera bring-up needs
# online tuning.
IMAGE_INSTALL:append = " \
    camera-engine-rkaiq-rk3576-server \
    camera-engine-rkaiq-rk3576-iqfiles \
"
